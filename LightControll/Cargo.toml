[package]
edition      = "2024"
name         = "GroupOne"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "GroupOne"
path = "./src/bin/main.rs"

[dependencies]
esp-idf-sys = { version = "0.37.2", features = ["binstart", "native"] }
esp-idf-svc = {version="0.52.1",features = ["alloc"]}
esp-idf-hal = "0.46.2"
anyhow = "1.0.104"
log = "0.4.34"
esp_idf_logger = "0.1.1"
mqttrs = "0.4.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[build-dependencies]
embuild =  { version = "0.33", features = ["espidf"] }
